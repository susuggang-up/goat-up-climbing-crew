<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>산양 클라이밍 데일리 투표</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐐</text></svg>">
<style>
  :root{--bg:#111;--card:#222;--card2:#2c2c2e;--line:#3a3a3c;--txt:#f2f2f2;--sub:#9a9aa0;--acc:#8b7cf6;--acc2:#5b4fd6;--red:#ff6b6b;--green:#3ecf8e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px}
  header{position:sticky;top:0;z-index:5;background:#000;padding:14px 16px 0}
  .top{display:flex;align-items:center;justify-content:space-between}
  .top h1{font-size:19px;margin:0}
  .me{font-size:13px;color:var(--sub);background:var(--card2);border:0;border-radius:99px;padding:6px 12px;color:var(--txt)}
  nav{display:flex;margin-top:12px}
  nav button{flex:1;background:none;border:0;color:var(--sub);font-size:15px;font-weight:600;padding:10px 0;border-bottom:2px solid transparent}
  nav button.on{color:var(--txt);border-color:var(--acc)}
  main{padding:14px 12px 90px;max-width:560px;margin:0 auto}
  .card{background:var(--card);border-radius:22px;padding:18px 16px;margin-bottom:14px}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--acc2);margin-right:6px;vertical-align:middle}
  .badge.번개{background:#d9822b}.badge.원정{background:#2b8ad9}.badge.기타{background:#666}
  .badge.closed{background:#444;color:#bbb}
  .ptitle{font-size:20px;font-weight:800;margin:8px 0 4px;word-break:keep-all}
  .meta{font-size:13px;color:var(--sub);margin-bottom:10px}
  .meta b{color:var(--txt)}
  .hday{color:#ff4d4d}
  .meta b.cd.urgent{color:#ff4d4d;font-size:15px}
  .desc{font-size:14px;color:#ddd;white-space:pre-wrap;margin:0 0 10px}
  .opt{position:relative;display:block;width:100%;text-align:left;background:var(--card2);border:1.5px solid transparent;color:var(--txt);border-radius:14px;padding:11px 12px;margin:7px 0;font-size:16px;overflow:hidden}
  .opt.mine{border-color:var(--acc)}
  .opt .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(139,124,246,.18);transition:width .3s}
  .opt .row{position:relative;display:flex;align-items:center;gap:8px}
  .opt .no{color:var(--acc);font-weight:800;min-width:20px}
  .opt .lab{flex:1}
  .opt .cnt{font-size:14px;color:var(--sub);font-weight:700}
  .opt.mine .cnt{color:var(--acc)}
  .opt .who{position:relative;display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px 28px}
  .chip{display:inline-block;font-size:13px;font-weight:700;padding:4px 9px;border-radius:7px;line-height:1.2;background:#48484a;color:#fff}
  .chip.m{background:#2f6fde}.chip.f{background:#e0559b}
  .chip.me{box-shadow:0 0 0 2px #fff inset}
  .opt.sel{border-color:#fff;border-style:dashed}
  .vote{margin-top:12px}
  .vote .btn{width:100%;padding:14px;font-size:16px}
  .vote .btn[disabled]{background:#3a3a3c;color:#888}
  .cm .c .ed{margin-left:4px;font-size:12px;color:var(--sub);background:none;border:0;padding:2px 4px;text-decoration:underline}
  .gseg{display:flex;gap:8px}
  .gseg button{flex:1;border:2px solid var(--line);background:var(--card2);color:var(--txt);padding:12px;border-radius:12px;font-size:16px;font-weight:700}
  .gseg button.on[data-g="남"]{background:#2f6fde;border-color:#2f6fde}
  .gseg button.on[data-g="여"]{background:#e0559b;border-color:#e0559b}
  .opt[disabled]{opacity:1}
  .chk{width:18px;height:18px;border-radius:50%;border:2px solid #666;flex:none}
  .opt.mine .chk{border-color:var(--acc);background:var(--acc);box-shadow:inset 0 0 0 3px var(--card2)}
  .multi .chk{border-radius:5px}
  .sum{font-size:13px;color:var(--sub);margin-top:6px}
  .cm{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .cm .c{font-size:14px;margin:8px 0;display:flex;align-items:flex-start;gap:6px}
  .cm .c .tx{flex:1;min-width:0;word-break:break-all;padding-top:3px}
  .cm .c .tools{margin-left:auto;white-space:nowrap;flex:none;padding-top:2px}
  .cm .c .cin{flex:1;margin:0}
  .cm .c .ed.del{color:#ff6b6b}
  .orow{display:flex;align-items:center;gap:8px;margin:6px 0}
  .orow .no{color:var(--acc);font-weight:800;min-width:20px;text-align:center}
  .orow input{flex:1}
  .odel{background:none;border:0;color:#ff6b6b;font-size:14px;font-weight:700;padding:8px 4px;white-space:nowrap}
  .odel[disabled]{color:#555}
  .olock{font-size:12px;color:var(--sub);white-space:nowrap;padding:0 2px}
  .cfm{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
  .cfm .box{background:#2c2c2e;border-radius:16px;width:100%;max-width:300px;overflow:hidden;text-align:center}
  .cfm .msg{padding:22px 18px;font-size:16px;font-weight:600;line-height:1.4}
  .cfm .bt{display:flex;border-top:1px solid #444}
  .cfm .bt button{flex:1;background:none;border:0;color:var(--txt);font-size:16px;padding:14px}
  .cfm .bt button+button{border-left:1px solid #444}
  .cfm .bt .ok{color:#ff6b6b;font-weight:700}
  .cm .c b{margin-right:6px}
  .cm .c span.t{color:var(--sub);font-size:11px;margin-left:6px}
  .cin{display:flex;gap:6px;margin-top:8px}
  input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 12px;font-size:16px;font-family:inherit}
  textarea{min-height:90px;resize:vertical}
  .btn{background:var(--acc2);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:700;white-space:nowrap}
  .btn.ghost{background:var(--card2);color:var(--txt)}
  .btn:disabled{opacity:.3}
  .btn.red{background:#3a1f1f;color:#ff6b6b}
  .btn.full{width:100%;padding:14px}
  .small{font-size:12px;color:var(--sub)}
  .acts{display:flex;gap:8px;margin-top:10px}
  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
  .chips button{background:var(--card2);border:0;color:var(--txt);padding:7px 14px;border-radius:99px;font-size:14px;white-space:nowrap}
  .chips button.on{background:var(--acc2)}
  .hist{cursor:pointer}
  .hist .ptitle{font-size:16px;margin:6px 0 2px}
  .empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:14px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:#1c1c1e;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px 28px;max-height:92vh;overflow:auto}
  .sheet h2{margin:0 0 12px;font-size:19px}
  .sheet label{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;background:var(--card2);border:0;color:var(--txt);padding:10px;border-radius:10px;font-size:15px}
  .seg button.on{background:var(--acc2)}
  .err{color:var(--red);font-size:14px;margin-top:10px;min-height:1em}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:30}
  .loading{opacity:.5;pointer-events:none}
  .fab{position:fixed;right:18px;bottom:24px;z-index:6;background:var(--acc2);color:#fff;border:0;border-radius:99px;padding:14px 20px;font-size:15px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--sub);font-weight:600}
  td.n{text-align:right}
</style>
</head>
<body>
<header>
  <div class="top"><h1 id="appTitle">투표</h1><button class="me" id="meBtn" style="display:none"></button></div>
  <nav>
    <button data-tab="daily" class="on">오늘 투표</button>
    <button data-tab="events">번개·원정</button>
    <button data-tab="history">기록</button>
    <button data-tab="members">멤버</button>
  </nav>
</header>
<main id="main"><div class="empty">불러오는 중…</div></main>
<button class="fab" id="fab" style="display:none">＋ 번개·원정 만들기</button>
<div id="modalRoot"></div>
<div id="confirmRoot"></div>

<script>
const LS_KEY = 'climbVoteUser';
let me = null, state = null, tab = 'daily', admin = null;
let pending = {}, editing = null;
const gcls = g => g === '남' ? 'm' : (g === '여' ? 'f' : '');
let hist = { type: '전체', page: 0, polls: [], more: false, open: {}, month: '' };

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const API = 'https://script.google.com/macros/s/AKfycbzQxMArTPVaK6nv8wr670N6_LJF_Unt9l-0b3vPF8dd53M25jyeXEhLav2qv6gUxGa2/exec';
async function run(fn, ...args) {
  let lastErr;
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const r = await fetch(API, { method: 'POST', body: JSON.stringify({ fn, args }), redirect: 'follow' });
      const j = await r.json();
      if (!j.ok) throw new Error(j.e || '오류가 났어요');
      return j.r;
    } catch (e) {
      lastErr = e;
      if (e instanceof TypeError && attempt === 0 && /^api_(state|history|members|stats|check)/.test(fn)) { await new Promise(r => setTimeout(r, 600)); continue; } // 읽기만 하는 요청은 순간 오류면 한 번 더
      break;
    }
  }
  throw (lastErr instanceof TypeError ? new Error('인터넷 연결을 확인해 주세요') : lastErr);
}
function errMsg(e) { const m = (e && e.message) || String(e); return m.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, ''); }
function confirmBox(msg, ok) {
  return new Promise(res => {
    const r = $('#confirmRoot');
    r.innerHTML = `<div class="cfm"><div class="box"><div class="msg">${esc(msg)}</div><div class="bt"><button class="no">취소</button><button class="ok">${esc(ok || '확인')}</button></div></div></div>`;
    const done = v => { r.innerHTML = ''; res(v); };
    r.querySelector('.no').onclick = () => done(false);
    r.querySelector('.ok').onclick = () => done(true);
    r.querySelector('.cfm').onclick = e => { if (e.target.classList.contains('cfm')) done(false); };
  });
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
/* ── 로그인 기억: 브라우저마다 막히는 저장소가 달라서 여러 곳에 같이 저장 ── */
let REMEMBER = true;
function idb(fn) {
  return new Promise(res => {
    try {
      const r = indexedDB.open('climbVote', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { try { fn(r.result.transaction('kv', 'readwrite').objectStore('kv'), res); } catch (e) { res(null); } };
      r.onerror = () => res(null);
      setTimeout(() => res(null), 1500);
    } catch (e) { res(null); }
  });
}
const idbSet = v => idb((st, res) => { st.put(v, 'me'); res(true); });
const idbGet = () => idb((st, res) => { const q = st.get('me'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); });
const idbDel = () => idb((st, res) => { st.delete('me'); res(true); });
function readCookie() { try { const m = document.cookie.match(new RegExp('(?:^|; )' + LS_KEY + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; } catch (e) { return null; } }
function save(u, remember) {
  if (remember === undefined) remember = REMEMBER;
  const v = JSON.stringify({ id: u.id, name: u.name, gender: u.gender || '' });
  try { sessionStorage.setItem(LS_KEY, v); } catch (e) {}
  if (!remember) return;
  try { localStorage.setItem(LS_KEY, v); } catch (e) {}
  try { document.cookie = LS_KEY + '=' + encodeURIComponent(v) + '; max-age=31536000; path=/; SameSite=None; Secure'; } catch (e) {}
  idbSet(v);
}
function load() {
  const tries = [() => localStorage.getItem(LS_KEY), readCookie, () => sessionStorage.getItem(LS_KEY)];
  for (const t of tries) { try { const v = t(); if (v) return JSON.parse(v); } catch (e) {} }
  return null;
}
async function loadAsync() {
  const u = load(); if (u) return u;
  try { const v = await idbGet(); return v ? JSON.parse(v) : null; } catch (e) { return null; }
}
function clearMe() {
  try { localStorage.removeItem(LS_KEY); localStorage.removeItem('climbVoteState'); } catch (e) {}
  try { sessionStorage.removeItem(LS_KEY); } catch (e) {}
  try { document.cookie = LS_KEY + '=; max-age=0; path=/; SameSite=None; Secure'; } catch (e) {}
  idbDel(); me = null; state = null;
}

/* ── 시간 표시 ── */
function toDate(s) { const [d, t] = s.split(/[ T]/); const [y, m, dd] = d.split('-').map(Number); const [h, mi, se] = (t || '0:0').split(':').map(Number); return new Date(y, m - 1, dd, h, mi, se || 0); }
let clockSkew = 0;
function nowKST() { return new Date(Date.now() + clockSkew); }
function left(deadline) {
  const ms = toDate(deadline) - nowKST();
  if (ms <= 0) return '마감됨';
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000), sec = Math.floor(ms % 60000 / 1000);
  return (h ? `${h}시간 ` : '') + `${m}분 ${sec}초 남음`;
}
function isUrgent(deadline) { const ms = toDate(deadline) - nowKST(); return ms > 0 && ms <= 3600000; }
setInterval(() => {
  document.querySelectorAll('.cd[data-dl]').forEach(el => {
    const dl = el.dataset.dl, u = isUrgent(dl);
    el.textContent = (u ? '⏰ ' : '') + left(dl);
    el.classList.toggle('urgent', u);
  });
}, 1000);
function titleHtml(p) {
  const t = esc(p.title);
  return p.holiday ? t.replace(/(\d{1,2}월\s*\d{1,2}일)/, '<span class="hday">$1</span>') : t;
}
function dlLabel(deadline) {
  const d = toDate(deadline), W = '일월화수목금토'[d.getDay()];
  return `${d.getMonth() + 1}/${d.getDate()}(${W}) ${deadline.slice(11, 16)}`;
}

/* ── 로그인/등록 ── */
function showAuth(mode = 'login') {
  const reg = mode === 'reg';
  $('#modalRoot').innerHTML = `
  <div class="modal"><div class="sheet">
    <div style="text-align:center;font-size:36px">🐐</div>
    <h2 style="text-align:center;margin-top:4px">산양 멤버만 들어갈 수 있습니다.</h2>
    <div class="seg"><button data-m="login" class="${reg ? '' : 'on'}">로그인</button><button data-m="reg" class="${reg ? 'on' : ''}">처음이에요</button></div>
    ${reg ? `<div class="small" style="margin-top:14px;font-size:14px;color:var(--txt)">👋 처음 한 번만 등록해요</div>
    <label>입장 비밀번호 (방에서 안내받은 번호)</label>
    <input id="aGate" type="password" inputmode="numeric" placeholder="비밀번호">` : ''}
    <label>이름</label>
    <input id="aName" maxlength="10" placeholder="예: 선혁">
    ${reg ? '<label>성별</label><div class="gseg" id="aG"><button data-g="남">남</button><button data-g="여">여</button></div>' : ''}
    <label>PIN 숫자 4자리 ${reg ? '(다음에 로그인할 때 써요)' : ''}</label>
    <input id="aPin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" type="password">
    <label style="display:flex;align-items:center;gap:8px;color:var(--txt);font-size:15px;margin-top:14px"><input id="aKeep" type="checkbox" checked style="width:20px;height:20px"> 자동 로그인</label>
    <div class="err" id="aErr"></div>
    <button class="btn full" id="aGo">${reg ? '등록하고 시작' : '로그인'}</button>
    ${reg ? '' : '<div class="small" style="margin-top:12px;line-height:1.5">자동 로그인이 자꾸 풀리면 카톡 링크 화면 오른쪽 위 ⋮ (또는 공유) → <b>다른 브라우저로 열기</b>로 들어와 주세요.</div>'}
  </div></div>`;
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => showAuth(b.dataset.m));
  let gender = '';
  document.querySelectorAll('#aG button').forEach(b => b.onclick = () => {
    gender = b.dataset.g; document.querySelectorAll('#aG button').forEach(x => x.classList.toggle('on', x === b));
  });
  const go = async () => {
    const name = $('#aName').value.trim(), pin = $('#aPin').value.trim();
    $('#aErr').textContent = '';
    if (reg && !$('#aGate').value.trim()) { $('#aErr').textContent = '입장 비밀번호를 입력하세요.'; return; }
    if (reg && !gender) { $('#aErr').textContent = '남/여를 선택하세요.'; return; }
    $('#aGo').classList.add('loading'); $('#aGo').textContent = '잠시만요…';
    try {
      const r = reg ? await run('api_registerFull', name, pin, gender, $('#aGate').value.trim()) : await run('api_loginFull', name, pin);
      me = r.u;
      REMEMBER = $('#aKeep').checked;
      save(me, REMEMBER);
      $('#modalRoot').innerHTML = ''; applyState(r.s);
      if (REMEMBER && !load()) toast('이 브라우저는 자동 로그인 저장을 막고 있어요. 다른 브라우저로 열어주세요.');
    } catch (e) { $('#aErr').textContent = errMsg(e); $('#aGo').classList.remove('loading'); $('#aGo').textContent = reg ? '등록하고 시작' : '로그인'; }
  };
  $('#aGo').onclick = go;
  $('#aPin').onkeydown = e => { if (e.key === 'Enter') go(); };
}

function showGender(fromMenu) {
  $('#modalRoot').innerHTML = `
  <div class="modal" id="bg"><div class="sheet">
    <h2>성별을 선택해 주세요</h2>
    <div class="small">투표한 사람 이름이 남자는 파랑, 여자는 분홍으로 보여요.</div>
    <div class="gseg" style="margin-top:14px"><button data-g="남" class="${me.gender==='남'?'on':''}">남</button><button data-g="여" class="${me.gender==='여'?'on':''}">여</button></div>
    <div class="err" id="gErr"></div>
  </div></div>`;
  if (fromMenu) $('#bg').onclick = e => { if (e.target.id === 'bg') $('#modalRoot').innerHTML = ''; };
  document.querySelectorAll('.gseg button').forEach(b => b.onclick = async () => {
    try { me = await run('api_setGender', me.id, b.dataset.g); save(me); $('#modalRoot').innerHTML = ''; refresh(); }
    catch (e) { $('#gErr').textContent = errMsg(e); }
  });
}

function showMenu() {
  $('#modalRoot').innerHTML = `
  <div class="modal" id="bg"><div class="sheet">
    <h2>${esc(me.name)}</h2>
    <label>이름 바꾸기</label>
    <div class="cin"><input id="rn" value="${esc(me.name)}" maxlength="10"><button class="btn" id="rnGo">변경</button></div>
    <label>성별</label>
    <div class="cin"><button class="btn ghost" id="gChg" style="flex:1">${me.gender ? esc(me.gender) + ' · 바꾸기' : '선택하기'}</button></div>
    <label>관리자 모드 ${admin ? '✅ 켜짐' : ''}</label>
    <div class="cin"><input id="ad" inputmode="numeric" type="password" placeholder="관리자 PIN"><button class="btn ghost" id="adGo">${admin ? '끄기' : '켜기'}</button></div>
    <div class="err" id="mErr"></div>
    <div class="acts"><button class="btn red" id="out">로그아웃</button><button class="btn ghost" id="cls" style="flex:1">닫기</button></div>
  </div></div>`;
  $('#bg').onclick = e => { if (e.target.id === 'bg') $('#modalRoot').innerHTML = ''; };
  $('#cls').onclick = () => $('#modalRoot').innerHTML = '';
  $('#gChg').onclick = () => showGender(true);
  $('#out').onclick = () => { clearMe(); $('#modalRoot').innerHTML = ''; showAuth('login'); };
  $('#rnGo').onclick = async () => {
    try { me = await run('api_rename', me.id, $('#rn').value); save(me); $('#modalRoot').innerHTML = ''; toast('이름을 바꿨어요'); refresh(); }
    catch (e) { $('#mErr').textContent = errMsg(e); }
  };
  $('#adGo').onclick = async () => {
    if (admin) { admin = null; try { localStorage.removeItem('climbVoteAdmin'); } catch (e) {} $('#modalRoot').innerHTML = ''; render(); return; }
    const p = $('#ad').value.trim();
    if (await run('api_checkAdmin', p)) { admin = p; try { localStorage.setItem('climbVoteAdmin', p); } catch (e) {} $('#modalRoot').innerHTML = ''; toast('관리자 모드 켜짐'); render(); }
    else $('#mErr').textContent = '관리자 PIN이 틀렸어요.';
  };
}

/* ── 이벤트 만들기 ── */
function showCreate(ep) {
  const t = nowKST(); t.setHours(t.getHours() + 3, 0, 0, 0);
  const pad = n => String(n).padStart(2, '0');
  const dl = ep ? ep.deadline.replace(' ', 'T') : `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}T${pad(t.getHours())}:00`;
  let type = ep ? ep.type : '번개';
  const isDaily = ep && ep.type === '데일리';
  $('#modalRoot').innerHTML = `
  <div class="modal" id="bg"><div class="sheet">
    <h2>${ep ? '투표 수정' : '새 투표 만들기'}</h2>
    ${isDaily ? '<div class="small">데일리 투표 (오늘 것만 바뀌어요. 매일 기본 항목은 시트의 데일리항목 탭에서 바꿔요)</div>'
      : `<div class="seg" id="tSeg">${['번개', '원정', '기타'].map(x => `<button class="${x === type ? 'on' : ''}">${x}</button>`).join('')}</div>`}
    <label>제목</label><input id="cT" maxlength="60" placeholder="예: 오늘 밤 서면 번개 ⚡" value="${ep ? esc(ep.title) : ''}">
    <label>모이는 날짜</label><input id="cD" type="date" value="${ep ? esc(ep.date) : dl.slice(0,10)}">
    <label>투표 마감</label><input id="cDl" type="datetime-local" value="${dl}">
    <label>항목</label>
    <div id="optList"></div>
    <button class="btn ghost" id="addOpt" style="width:100%;margin-top:4px">＋ 항목 추가</button>
    ${ep ? '<div class="small" style="margin-top:6px">이미 투표가 있는 항목은 지울 수 없어요 (글자 수정은 가능).</div>' : ''}
    <label style="display:flex;align-items:center;gap:8px;color:var(--txt)"><input id="cM" type="checkbox" style="width:auto" ${ep && ep.multi ? 'checked' : ''}> 여러 개 선택 가능</label>
    <label>설명 (장소, 시간, 회비 등)</label><textarea id="cDesc" maxlength="500">${ep ? esc(ep.desc) : ''}</textarea>
    <div class="err" id="cErr"></div>
    <div class="acts"><button class="btn ghost" id="cls">취소</button><button class="btn" id="cGo" style="flex:1">${ep ? '수정 저장' : '올리기'}</button></div>
  </div></div>`;
  document.querySelectorAll('#tSeg button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#tSeg button').forEach(x => x.classList.remove('on')); b.classList.add('on'); type = b.textContent;
  });
  let items = ep ? ep.options.map((o, i) => ({ orig: i, text: o, votes: ep.voters[i].length }))
    : ['참석 🙋', '고민중 🤔', '불참 🙅'].map(o => ({ orig: -1, text: o, votes: 0 }));
  const drawOpts = () => {
    $('#optList').innerHTML = items.map((it, k) => `<div class="orow"><span class="no">${k + 1}</span>
      <input data-oi="${k}" value="${esc(it.text)}" maxlength="60" placeholder="항목 내용">
      ${it.votes ? `<span class="olock">투표 ${it.votes}명</span>` : `<button class="odel" data-od="${k}" ${items.length <= 2 ? 'disabled' : ''}>삭제</button>`}</div>`).join('');
    document.querySelectorAll('[data-oi]').forEach(inp => inp.oninput = () => { items[Number(inp.dataset.oi)].text = inp.value; });
    document.querySelectorAll('[data-od]').forEach(b => b.onclick = () => { items.splice(Number(b.dataset.od), 1); drawOpts(); });
  };
  drawOpts();
  $('#addOpt').onclick = () => {
    if (items.length >= 20) return toast('항목은 20개까지예요');
    items.push({ orig: -1, text: '', votes: 0 }); drawOpts();
    const ins = document.querySelectorAll('[data-oi]'); ins[ins.length - 1].focus();
  };
  $('#cls').onclick = () => $('#modalRoot').innerHTML = '';
  $('#cGo').onclick = async () => {
    $('#cGo').classList.add('loading'); $('#cErr').textContent = '';
    const kept = items.map(it => ({ orig: it.orig, text: it.text.trim() })).filter(it => it.text);
    if (kept.length < 2) { $('#cErr').textContent = '항목을 2개 이상 적어주세요.'; $('#cGo').classList.remove('loading'); return; }
    const d = {
      type, title: $('#cT').value, date: $('#cD').value, deadline: $('#cDl').value,
      options: kept.map(it => it.text), optionMap: kept.map(it => it.orig), multi: $('#cM').checked, desc: $('#cDesc').value,
    };
    try {
      if (ep) {
        await act('updatePoll', ep.id, d, admin || '');
        delete pending[ep.id];
        $('#modalRoot').innerHTML = ''; toast('투표를 수정했어요'); render(); if (tab === 'history') loadHistory(0);
      } else {
        await act('createEvent', d);
        $('#modalRoot').innerHTML = ''; toast('투표를 올렸어요'); tab = 'events'; setTab(); render();
      }
    } catch (e) { $('#cErr').textContent = errMsg(e); $('#cGo').classList.remove('loading'); }
  };
}

/* ── 렌더링 ── */
function pollCard(p, opts = {}) {
  const max = Math.max(1, ...p.voters.map(v => v.length));
  const typeBadge = `<span class="badge ${esc(p.type)}">${esc(p.type)}</span>`;
  const st = p.open ? `<b class="cd ${isUrgent(p.deadline) ? 'urgent' : ''}" data-dl="${esc(p.deadline)}">${isUrgent(p.deadline) ? '⏰ ' : ''}${left(p.deadline)}</b>` : `<span class="badge closed">마감</span>`;
  const sel = pending[p.id] || p.mine;
  const changed = pending[p.id] && JSON.stringify(pending[p.id]) !== JSON.stringify(p.mine);
  const optsHtml = p.options.map((o, i) => {
    const mine = p.mine.includes(i), picked = sel.includes(i), n = p.voters[i].length;
    return `<button class="opt ${picked ? 'mine' : ''} ${picked && !mine ? 'sel' : ''}" data-poll="${esc(p.id)}" data-i="${i}" ${p.open ? '' : 'disabled'}>
      <div class="bar" style="width:${n / max * 100}%"></div>
      <div class="row"><span class="no">${i + 1}</span><span class="lab">${esc(o)}</span><span class="cnt">${n ? n + '명' : ''}</span>${p.open ? '<span class="chk"></span>' : ''}</div>
      ${n ? `<div class="who">${p.voters[i].map(v => `<span class="chip ${gcls(v.g)} ${v.id === me.id ? 'me' : ''}">${esc(v.n)}</span>`).join('')}</div>` : ''}
    </button>`;
  }).join('');
  let voteBtn = '';
  if (p.open) {
    const label = !changed ? (p.mine.length ? '✅ 투표 완료 (항목을 바꾸면 다시 투표할 수 있어요)' : '항목을 고른 뒤 투표하기')
      : (sel.length ? (p.mine.length ? '다시 투표하기' : '투표하기') : '투표 취소하기');
    voteBtn = `<div class="vote"><button class="btn" data-vote="${esc(p.id)}" ${changed ? '' : 'disabled'}>${label}</button></div>`;
  }
  const cms = p.comments.map(c => {
    if (editing === c.id) return `<div class="c"><div class="cin"><input id="ed-${esc(c.id)}" value="${esc(c.text)}" maxlength="300"><button class="btn" data-esave="${esc(c.id)}">저장</button><button class="btn ghost" data-ecancel="1">취소</button></div></div>`;
    const tools = c.mine ? `<button class="ed" data-edit="${esc(c.id)}">수정</button><button class="ed del" data-cdel="${esc(c.id)}">삭제</button>`
      : (admin ? `<button class="ed del" data-cdel="${esc(c.id)}">삭제</button>` : '');
    return `<div class="c"><span class="chip ${gcls(c.g)}" style="flex:none">${esc(c.name)}</span><span class="tx">${esc(c.text)}<span class="t">${esc(c.at.slice(5, 16))}${c.edited ? ' (수정됨)' : ''}</span></span>${c.id && tools ? `<span class="tools">${tools}</span>` : ''}</div>`;
  }).join('');
  const canManage = p.open && (admin || (p.isCreator && p.type !== '데일리'));
  const canDelete = admin || (p.isCreator && p.type !== '데일리');
  return `<div class="card ${p.multi ? 'multi' : ''}" id="card-${esc(p.id)}">
    ${typeBadge}<span class="small">${p.multi ? '복수선택' : '1개 선택'}</span>
    <div class="ptitle">${titleHtml(p)}</div>
    <div class="meta">마감 ${dlLabel(p.deadline)} · ${st}${p.type !== '데일리' ? ` · 만든 사람 ${esc(p.creator)}` : ''}</div>
    ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
    ${optsHtml}
    <div class="sum">참여 ${p.total}명${p.mine.length ? ' · ✅ 투표 완료' : (p.open ? ' · 아직 투표 안 했어요' : '')}</div>
    ${voteBtn}
    <div class="cm">${cms || '<div class="small">댓글이 없어요</div>'}
      <div class="cin"><input placeholder="댓글 (타 암장 장소, 같이 가는 지인 등)" maxlength="300" id="ci-${esc(p.id)}"><button class="btn" data-cm="${esc(p.id)}">등록</button></div>
    </div>
    ${(canManage || canDelete) ? `<div class="acts"><button class="btn ghost" data-pedit="${esc(p.id)}">수정</button>${canManage ? `<button class="btn ghost" data-st="마감" data-p="${esc(p.id)}">지금 마감</button>` : ''}${canDelete ? `<button class="btn red" data-st="삭제" data-p="${esc(p.id)}">삭제</button>` : ''}</div>` : ''}
  </div>`;
}

function render() {
  const m = $('#main');
  $('#fab').style.display = (me && tab === 'events') ? 'block' : 'none';
  if (!state) return;
  if (tab === 'daily') {
    m.innerHTML = state.daily ? pollCard(state.daily) : '<div class="empty">데일리 투표가 꺼져 있어요.</div>';
    m.innerHTML += `<div class="small" style="text-align:center">평일 21:00 · 주말/공휴일 19:00 마감 · 마감되면 바로 다음 날 투표가 열려요</div>`;
  } else if (tab === 'events') {
    m.innerHTML = state.events.length ? state.events.map(p => pollCard(p)).join('')
      : '<div class="empty">진행 중인 번개·원정이 없어요.<br>아래 버튼으로 만들어 보세요!</div>';
  } else if (tab === 'members') renderMembers();
  else renderHistory();
  bind();
}

let membersCache = null;
function renderMembers() {
  const m = $('#main');
  const draw = list => {
    const male = list.filter(x => x.gender === '남').length, female = list.filter(x => x.gender === '여').length;
    m.innerHTML = `<div class="card">
      <div class="ptitle" style="margin-top:0">🐐 산양 크루 멤버 ${list.length}명</div>
      <div class="meta"><span class="chip m">남 ${male}</span> <span class="chip f">여 ${female}</span>${list.length - male - female ? ` <span class="chip">미선택 ${list.length - male - female}</span>` : ''}</div>
      <table><tr><th style="width:36px">#</th><th>이름</th><th class="n">가입일</th></tr>${
        list.map((x, i) => `<tr><td>${i + 1}</td><td><span class="chip ${gcls(x.gender)} ${x.me ? 'me' : ''}">${esc(x.name)}</span></td><td class="n small">${esc(x.joined.slice(5).replace('-', '/'))}</td></tr>`).join('')
      }</table></div>`;
  };
  if (membersCache) draw(membersCache); else m.innerHTML = '<div class="empty">불러오는 중…</div>';
  run('api_members', me.id).then(list => { membersCache = list; if (tab === 'members') draw(list); })
    .catch(e => { if (tab === 'members') m.innerHTML = `<div class="empty">${esc(errMsg(e))}</div>`; });
}

function renderHistory() {
  const m = $('#main');
  const chips = ['전체', '데일리', '번개', '원정', '기타', '통계'].map(t => `<button data-ht="${t}" class="${hist.type === t ? 'on' : ''}">${t}</button>`).join('');
  if (hist.type === '통계') {
    m.innerHTML = `<div class="chips">${chips}</div><div class="card" id="stats">불러오는 중…</div>`;
    bindChips();
    run('api_stats', me.id, hist.month || '').then(r => {
      if (hist.type !== '통계' || !$('#stats')) return;
      if (Array.isArray(r)) r = { month: '', months: [], dailyTotal: 0, eventTotal: 0, list: r };
      hist.month = r.month;
      const i = r.months.indexOf(r.month);
      const older = i >= 0 && i < r.months.length - 1 ? r.months[i + 1] : '';
      const newer = i > 0 ? r.months[i - 1] : '';
      const [yy, mm] = (r.month || '').split('-');
      const medal = ['🥇', '🥈', '🥉'];
      $('#stats').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <button class="btn ghost" id="mPrev" style="padding:6px 14px" ${older ? '' : 'disabled'}>‹</button>
          <div style="font-size:17px;font-weight:800">${yy ? `${yy}년 ${+mm}월` : ''}</div>
          <button class="btn ghost" id="mNext" style="padding:6px 14px" ${newer ? '' : 'disabled'}>›</button>
        </div>
        <div class="small" style="text-align:center;margin-bottom:10px">데일리 투표 ${r.dailyTotal}회 · 번개·원정 ${r.eventTotal}회</div>
        ${r.list.length ? `<table><tr><th>#</th><th>이름</th><th class="n">데일리</th><th class="n">번개·원정</th><th class="n">합계</th></tr>${
          r.list.map((x, k) => `<tr><td>${medal[k] || k + 1}</td><td><span class="chip ${gcls(x.gender)} ${x.name === me.name ? 'me' : ''}">${esc(x.name)}</span></td><td class="n">${x.daily}${r.dailyTotal ? `<span class="small">/${r.dailyTotal}</span>` : ''}</td><td class="n">${x.event}</td><td class="n"><b>${x.daily + x.event}</b></td></tr>`).join('')}</table>`
          : '<div class="empty">이 달에는 기록이 없어요.</div>'}
        <div class="small" style="margin-top:8px">마감된 투표에 참여한 횟수 (마감일 기준)</div>`;
      if (older) $('#mPrev').onclick = () => { hist.month = older; render(); };
      if (newer) $('#mNext').onclick = () => { hist.month = newer; render(); };
    }).catch(e => { if ($('#stats')) $('#stats').textContent = errMsg(e); });
    return;
  }
  const items = hist.polls.map(p => {
    if (hist.open[p.id]) return pollCard(p);
    let best = -1, bi = -1; p.voters.forEach((v, i) => { if (v.length > best) { best = v.length; bi = i; } });
    return `<div class="card hist" data-h="${esc(p.id)}">
      <span class="badge ${esc(p.type)}">${esc(p.type)}</span><span class="small">${dlLabel(p.deadline)} 마감</span>
      <div class="ptitle">${titleHtml(p)}</div>
      <div class="meta">참여 ${p.total}명${best > 0 ? ` · 1위 ${esc(p.options[bi])} (${best})` : ''} · 눌러서 자세히</div>
    </div>`;
  }).join('');
  m.innerHTML = `<div class="chips">${chips}</div>${items || '<div class="empty">아직 마감된 투표가 없어요.</div>'}
    ${hist.more ? '<button class="btn ghost full" id="more">더 보기</button>' : ''}`;
  bindChips();
  document.querySelectorAll('[data-h]').forEach(el => el.onclick = () => { hist.open[el.dataset.h] = true; render(); });
  if ($('#more')) $('#more').onclick = () => loadHistory(hist.page + 1);
}
function bindChips() {
  document.querySelectorAll('[data-ht]').forEach(b => b.onclick = () => {
    hist.type = b.dataset.ht; hist.open = {};
    if (hist.type === '통계') render(); else loadHistory(0);
  });
}
async function loadHistory(page) {
  if (page === 0) { hist.polls = []; $('#main').classList.add('loading'); }
  try {
    const r = await run('api_history', me.id, hist.type, page);
    hist.page = page; hist.more = r.more; hist.polls = page === 0 ? r.polls : hist.polls.concat(r.polls);
  } catch (e) { toast(errMsg(e)); }
  $('#main').classList.remove('loading');
  if (tab === 'history') render();
}

function findPoll(id) {
  return (state.daily && state.daily.id === id) ? state.daily : (state.events.find(p => p.id === id) || hist.polls.find(p => p.id === id));
}

function bind() {
  document.querySelectorAll('.opt[data-poll]').forEach(b => b.onclick = async () => {
    const p = findPoll(b.dataset.poll); if (!p || !p.open) return;
    const i = Number(b.dataset.i);
    let ch = (pending[p.id] || p.mine).slice();
    if (p.multi) ch = ch.includes(i) ? ch.filter(x => x !== i) : ch.concat(i).sort((a, c) => a - c);
    else ch = ch.includes(i) ? [] : [i];
    pending[p.id] = ch; render();
  });
  document.querySelectorAll('[data-vote]').forEach(b => b.onclick = async () => {
    const p = findPoll(b.dataset.vote); if (!p || !pending[p.id]) return;
    const ch = pending[p.id];
    // 화면 먼저 바꾸고, 저장은 뒤에서
    p.voters.forEach(v => { const k = v.findIndex(x => x.id === me.id); if (k >= 0) v.splice(k, 1); });
    ch.forEach(k => p.voters[k].push({ id: me.id, n: me.name, g: me.gender }));
    p.total += (ch.length ? 1 : 0) - (p.mine.length ? 1 : 0); p.mine = ch.slice();
    delete pending[p.id]; render();
    toast(ch.length ? '투표했어요 ✅' : '투표를 취소했어요');
    try { await act('vote', p.id, ch); } catch (e) { toast(errMsg(e)); refresh(); }
  });
  document.querySelectorAll('[data-pedit]').forEach(b => b.onclick = () => { const p = findPoll(b.dataset.pedit); if (p) showCreate(p); });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { editing = b.dataset.edit; render(); const el = document.getElementById('ed-' + editing); if (el) el.focus(); });
  document.querySelectorAll('[data-ecancel]').forEach(b => b.onclick = () => { editing = null; render(); });
  document.querySelectorAll('[data-esave]').forEach(b => b.onclick = async () => {
    const id = b.dataset.esave, t = document.getElementById('ed-' + id).value.trim();
    b.classList.add('loading');
    try { await act('editComment', id, t, '', false); editing = null; toast('댓글을 고쳤어요'); render(); if (tab === 'history') loadHistory(0); }
    catch (e) { toast(errMsg(e)); b.classList.remove('loading'); }
  });
  document.querySelectorAll('[data-cdel]').forEach(b => b.onclick = async () => {
    if (!(await confirmBox('댓글을 삭제하시겠습니까?', '삭제'))) return;
    try { await act('editComment', b.dataset.cdel, '', admin || '', true); toast('댓글을 지웠어요'); render(); if (tab === 'history') loadHistory(0); }
    catch (e) { toast(errMsg(e)); }
  });
  document.querySelectorAll('[data-cm]').forEach(b => b.onclick = async () => {
    const id = b.dataset.cm, inp = document.getElementById('ci-' + id), t = inp.value.trim();
    if (!t) return;
    b.classList.add('loading');
    try { inp.value = ''; await act('comment', id, t); render(); if (tab === 'history') reloadHistPoll(); }
    catch (e) { toast(errMsg(e)); b.classList.remove('loading'); }
  });
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
    const st = b.dataset.st;
    if (!(await confirmBox(st === '삭제' ? '이 투표를 삭제하시겠습니까?' : '이 투표를 지금 마감하시겠습니까?', st))) return;
    try { await act('setStatus', b.dataset.p, st, admin || ''); toast(st === '삭제' ? '삭제했어요' : '마감했어요'); render(); if (tab === 'history') loadHistory(0); }
    catch (e) { toast(errMsg(e)); }
  });
}
function reloadHistPoll() { loadHistory(0); }

const STATE_KEY = 'climbVoteState';
function applyState(s, quiet) {
  if (!s || s.needLogin) return;
  state = s; me = s.me; save(me);
  clockSkew = toDate(s.now) - Date.now();
  try { localStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch (e) {}
  $('#appTitle').textContent = s.title; document.title = s.title;
  $('#meBtn').style.display = 'block'; $('#meBtn').textContent = '👤 ' + me.name;
  const active = document.activeElement;
  if (!(quiet && active && active.tagName === 'INPUT' && active.value)) render();
  if (!me.gender && !$('#modalRoot').innerHTML) showGender(false);
}
async function act(action, ...args) { applyState(await run('api_act', me.id, action, args), true); }
let refreshing = false;
async function refresh(quiet) {
  if (!me) return showAuth();
  if (refreshing) return; refreshing = true;
  try {
    const s = await run('api_state', me.id);
    if (s.needLogin) { clearMe(); refreshing = false; return showAuth('login'); }
    applyState(s, quiet);
  } catch (e) {
    if (!quiet) $('#main').innerHTML = `<div class="empty">불러오지 못했어요 😢<br>${esc(errMsg(e))}</div>`;
  }
  refreshing = false;
}

function setTab() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; setTab();
  if (tab === 'history') { render(); loadHistory(0); } else render();
});
$('#meBtn').onclick = showMenu;
$('#fab').onclick = () => showCreate();

// 30초마다 남은 시간 갱신, 2분마다 새로고침, 마감 지나면 바로 새로고침
setInterval(() => {
  if (!state || tab === 'history' || tab === 'members') return;
  const a = document.activeElement; if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
  if ([state.daily].concat(state.events).some(p => p && p.open && toDate(p.deadline) <= nowKST())) refresh(true);
  else render();
}, 30000);
setInterval(() => { if (tab !== 'history' && tab !== 'members') refresh(true); }, 120000);

(async () => {
me = await loadAsync();
try { const ap = localStorage.getItem('climbVoteAdmin'); if (ap) run('api_checkAdmin', ap).then(ok => { if (ok) { admin = ap; render(); } else localStorage.removeItem('climbVoteAdmin'); }); } catch (e) {}
if (me && me.id) {
  try { const cs = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); if (cs && cs.me && cs.me.id === me.id) { state = cs; $('#appTitle').textContent = cs.title; $('#meBtn').style.display = 'block'; $('#meBtn').textContent = '👤 ' + me.name; render(); } } catch (e) {}
  refresh(!!state);
} else showAuth();
})();
</script>
</body>
</html>
